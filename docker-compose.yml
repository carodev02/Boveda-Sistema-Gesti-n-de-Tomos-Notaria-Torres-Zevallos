services:
  postgres:
    image: postgres:16-alpine
    container_name: sigadn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sigadn
      POSTGRES_USER: sigadn
      POSTGRES_PASSWORD: sigadn_dev
    ports:
      - "5433:5432"
    volumes:
      - sigadn_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigadn -d sigadn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sigadn_postgres_data:
